name: GIS OSM river name dependency inventory
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |-
            /.github/
            /tools/
            /tests/
            /scripts/
            /config/
            /package.json
            /pnpm-lock.yaml
            /AGENTS.md
            /README.md
            /archive/index.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 27a22a6b69a14b4266bf816cc2c2c6ae8e49b3d4
          path: .dependencies/pando
          persist-credentials: false
      - name: Prepare only paired Hydro inputs
        run: node tools/data/library-data.mjs --purpose=gis
          --include-prefix=assets/data/hydro
          --include-prefix=assets/data/natural-earth
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Extract verified matched systems without modifying map data
        run: |
          node "$PANDO_LIBRARY_ROOT/tools/gis/hydro/inventory-osm-hydronyms.mjs" \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --output /tmp/osm-hydro-inventory.json
      - name: Decode original Hydro geometry using the published production decoder
        run: |
          node tools/gis/decode-hydro-connectivity.mjs \
            assets/data/hydro/v0.13.2 /tmp/hydro-decoded.json
      - name: Select pinned Natural Earth name geometry
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('assets/data/hydro/v0.13.2/manifest.json','utf8'));
          const expected=m.sources.naturalEarthNameReference.find(row=>row.file==='rivers_base.geojson')?.sha256;
          const bytes=fs.readFileSync('assets/data/hydro/rivers_base.geojson');
          if(!expected || createHash('sha256').update(bytes).digest('hex')!==expected)throw Error('Natural Earth reference source SHA-256 mismatch');
          fs.writeFileSync('/tmp/hydro-ne-reference.sha256',expected,{flag:'wx'});
          console.log('NE_RIVER_REFERENCE_SHA='+expected);
          JS
      - name: Independently compare remaining Hydro mainstem routes with Natural Earth
        run: |
          node tools/gis/compare-osm-hydro-natural-earth.mjs \
            --decoded /tmp/hydro-decoded.json \
            --natural-earth assets/data/hydro/rivers_base.geojson \
            --expected-sha256 "$(cat /tmp/hydro-ne-reference.sha256)" \
            --inventory /tmp/osm-hydro-inventory.json \
            --output /tmp/osm-ne-crosscheck.json
      - name: Independently check suspect Texas streams against USGS field stations
        run: |
          node tools/gis/check-official-usgs-hydro-gauges.mjs \
            --decoded /tmp/hydro-decoded.json \
            --output /tmp/usgs-official-anchor-check.json
      - name: Validate independently sourced names with the canonical Node policy
        run: node tools/gis/hydro-independent-name-policy.mjs --input
          $PANDO_LIBRARY_ROOT/tools/historical-library/hydro/hydro-independent-name-replacements.json
          > /tmp/hydro-independent-review-validated.json
      - name: Verify pinned USGS station distances against the original Python audit
          oracle
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const proof=JSON.parse(fs.readFileSync('/tmp/usgs-official-anchor-check.json','utf8'));
          const oracle=[
            ['USGS-08116650',0.218,48.839],['USGS-08114000',0.143,44.988],
            ['USGS-08117300',0.371,60.091],['USGS-08162500',40.811,0.199],
            ['USGS-08162504',57.549,0.153],['USGS-08162501',51.828,0.061],
          ];
          for(let i=0;i<oracle.length;i++){
            const row=proof.stationRows[i], [id,brazos,colorado]=oracle[i];
            if(row.station!==id||Math.abs(row.distancesToHydroMainstemKm['70816878']-brazos)>0.0011
                ||Math.abs(row.distancesToHydroMainstemKm['70819626']-colorado)>0.0011)
              throw Error('Independent pinned USGS metric changed: '+id);
          }
          JS
      - name: Verify USGS station evidence is tied to the exact published Hydro geometry
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {verifyStationEvidence} from './tools/gis/hydro-independent-name-policy.mjs';
          verifyStationEvidence(JSON.parse(readFileSync('/tmp/usgs-official-anchor-check.json')),JSON.parse(readFileSync('/tmp/hydro-independent-review-validated.json')));
          console.log('Both station-based source exemptions reproduced against original Hydro geometry');
          JS
      - name: Check all 42 reviewed mainstems independently of the 73 OSM-matched
          systems
        run: |
          node tools/gis/hydro-independent-name-policy.mjs \
            --input $PANDO_LIBRARY_ROOT/tools/historical-library/hydro/hydro-independent-name-replacements.json \
            > /tmp/hydro-independent-review-validated.json
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const verified=JSON.parse(fs.readFileSync('/tmp/hydro-independent-review-validated.json','utf8'));
          fs.writeFileSync('/tmp/reviewed-mainstem-scope.json',JSON.stringify({
            items:Object.entries(verified).map(([systemId,value])=>({systemId,nameKo:value.previousNameKo}))
          }));
          JS
          node tools/gis/compare-osm-hydro-natural-earth.mjs \
            --decoded /tmp/hydro-decoded.json --natural-earth assets/data/hydro/rivers_base.geojson \
            --expected-sha256 "$(cat /tmp/hydro-ne-reference.sha256)" \
            --inventory /tmp/reviewed-mainstem-scope.json \
            --output /tmp/reviewed-ne-crosscheck.json
      - name: Verify all lower-coverage candidate river names against independent
          Natural Earth line comparison
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {verifyNaturalEarthEvidence} from './tools/gis/hydro-independent-name-policy.mjs';
          verifyNaturalEarthEvidence(JSON.parse(readFileSync(new URL('file://'+process.env.PANDO_LIBRARY_ROOT+'/tools/historical-library/hydro/hydro-independent-name-replacements.json'))),JSON.parse(readFileSync('/tmp/reviewed-ne-crosscheck.json')));
          console.log('Source-independent 81-sample geometry comparisons reproduced for all reviewed river systems');
          JS
      - name: Build the read-only native vector screen
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq libgeos-dev
          libproj-dev ninja-build

          cmake -S tools/cpp -B build-native/hydro-point-screen -G Ninja
          -DCMAKE_BUILD_TYPE=Release \
            -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_HYDRO_POINT_SCREEN=ON
          cmake --build build-native/hydro-point-screen --target
          pando-hydro-point-screen

          node tools/gis/package-hydro-point-screen.mjs --binary
          build-native/hydro-point-screen/pando-hydro-point-screen --directory
          build-native/hydro-point-screen/artifact
      - name: Reproduce the independent Victorian Yarra government river vector check
        run: |
          node "$PANDO_LIBRARY_ROOT/tools/gis/hydro/verify-victorian-yarra-source.mjs" \
            --decoded /tmp/hydro-decoded.json \
            --output /tmp/yarra-government-vector-validated.json
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          import {verifyYarraEvidence} from './tools/gis/hydro-independent-name-policy.mjs';
          verifyYarraEvidence(JSON.parse(readFileSync('/tmp/yarra-government-vector-validated.json')),JSON.parse(readFileSync(new URL('file://'+process.env.PANDO_LIBRARY_ROOT+'/tools/historical-library/hydro/hydro-independent-name-replacements.json'))));
          console.log('Victoria government river centerline spatial verification reproduced');
          JS
      - name: Verify independently researched river-name records
        run: >
          node --test tests/unit/geometry/hydro-source-selection.test.mjs
          tests/unit/geometry/hydro-name.test.mjs
      - name: Verify current published independent names and immutable Hydro bytes
        run: |
          node "$PANDO_LIBRARY_ROOT/tools/gis/hydro/verify-published-hydro-independent-names.mjs" \
            --manifest assets/data/hydro/v0.13.2/manifest.json \
            --bundle assets/data/hydro/v0.13.2/hydro.bin \
            --archive-review assets/data/hydro/v0.13.2/hydro-independent-name-replacements.json \
            --current-review $PANDO_LIBRARY_ROOT/tools/historical-library/hydro/hydro-independent-name-replacements.json \
            --output /tmp/hydro-current-independent-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: gis-osm-hydro-inventory
          path: |
            /tmp/osm-hydro-inventory.json
            /tmp/osm-ne-crosscheck.json
            /tmp/usgs-official-anchor-check.json
            /tmp/yarra-government-vector-validated.json
            /tmp/hydro-current-independent-proof.json
          retention-days: 14
    env:
      PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
      PANDO_LIBRARY_ROOT: ${{ github.workspace }}
      PANDOLAB_LIBRARY_DATA_ROOT: ${{ github.workspace }}
      NODE_OPTIONS: --import=${{ github.workspace }}/tools/register-consumer.mjs
    defaults:
      run:
        working-directory: .dependencies/pando
