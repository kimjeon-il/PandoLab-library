name: Library QGIS native bridge
run-name: QGIS native ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  qgis-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |-
            .github
            tools
            tests
            scripts
            config
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 19fd518ca115786d0179347f677cb94596110ed4
          path: .dependencies/pando
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
      - name: Install locked MCP test dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reuse pinned QGIS SDK archives
        id: qgis-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: build-native/qgis-sdk/*.tar.bz2
          key: qgis-sdk-${{ runner.os
            }}-qgis-3.44.15-qt-5.15.13-gdal-3.13.3-geos-3.15.0-proj-9.8.1-v1
      - name: Download and verify the matching OSGeo4W development packages
        shell: pwsh
        run: >
          if ((Get-PSDrive -Name C).Free -lt 7GB) { throw 'Need estimated 2 GiB
          SDK/build space plus 5 GiB headroom' }

          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"

          New-Item -ItemType Directory -Force -Path $sdk | Out-Null

          $packages = @(
            @{name='qgis'; path='qgis/qgis-ltr/qgis-ltr-devel/qgis-ltr-devel-3.44.15-1.tar.bz2'; sha='D55BA2C310AAEEE31C075AE049CF4ADDD51701988534616F4ECB475FC3097897'},
            @{name='qt'; path='qt5/qt5-devel/qt5-devel-5.15.13-2.tar.bz2'; sha='D3F70B83B9BBEB7F6EDE7054D7DC3607F2C5DBE02DC316C79C33BD6ED3B6389C'},
            @{name='gdal'; path='gdal/gdal-devel/gdal-devel-3.13.3-3.tar.bz2'; sha='2475B7AB14A8437B925D1E96908AD5E22B8296ADF01E00B9ECA3EF0816B736C2'},
            @{name='geos'; path='geos/geos-devel/geos-devel-3.15.0-1.tar.bz2'; sha='6D62956B904C0BC5B2825F2EADFBD1DCD2342B82F1881E79AAE6561CE1EE2021'},
            @{name='proj'; path='proj/proj-devel/proj-devel-9.8.1-1.tar.bz2'; sha='B8A6F4DBB800F019BE4F4C45849B53818F2074213B850DFC38681CC99D0E3889'}
          )

          foreach ($package in $packages) {
            $archive = Join-Path $sdk ($package.name + '.tar.bz2')
            if ((Test-Path -LiteralPath $archive -PathType Leaf) -and (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -eq $package.sha) {
              Write-Output "Reusing verified $($package.name) SDK archive"
              continue
            }
            Write-Output "Downloading $($package.name) SDK"
            $url = 'https://download-cache.osgeo.org/osgeo4w/v2/x86_64/release/' + $package.path
            curl.exe --proto '=https' --tlsv1.2 --fail --location --max-time 180 --max-filesize 30000000 $url --output $archive
            if ($LASTEXITCODE -ne 0) { throw "SDK download failed: $($package.name)" }
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $package.sha) { throw "SDK digest mismatch: $($package.name)" }
          }
      - name: Cache verified QGIS SDK archives
        if: steps.qgis-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-native/qgis-sdk/*.tar.bz2
          key: ${{ steps.qgis-sdk-cache.outputs.cache-primary-key }}
      - name: Extract QGIS headers and import libraries
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qgis.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK decompression failed' }
          & $zip x -y "$sdk/packed/qgis.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'QGIS SDK extraction failed' }
      - name: Extract Qt headers and import libraries
        timeout-minutes: 6
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $zip x -y "$sdk/qt.tar.bz2" "-o$sdk/packed" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK decompression failed' }
          & $zip x -y "$sdk/packed/qt.tar" "-o$sdk" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK extraction failed' }
      - name: Extract GIS development headers
        timeout-minutes: 4
        shell: pwsh
        run: |
          $sdk = "$env:GITHUB_WORKSPACE/build-native/qgis-sdk"
          $zip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          foreach ($name in @('gdal','geos','proj')) {
            & $zip x -y "$sdk/$name.tar.bz2" "-o$sdk/packed" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK decompression failed" }
            & $zip x -y "$sdk/packed/$name.tar" "-o$sdk" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$name SDK extraction failed" }
          }
      - name: Build the optional native QGIS bridge
        shell: pwsh
        run: >
          cmake -S tools/cpp/qgis -B build-native/qgis/native -A x64
          -DPANDO_CONSUMER_ROOT="$env:PANDO_CONSUMER_ROOT"
          -DPANDO_QGIS_SDK_ROOT="$env:GITHUB_WORKSPACE/build-native/qgis-sdk"

          if ($LASTEXITCODE -ne 0) { throw 'QGIS CMake configure failed' }

          cmake --build build-native/qgis/native --config Release --target
          pando-qgis-bridge --parallel 1

          if ($LASTEXITCODE -ne 0) { throw 'QGIS native bridge build failed' }
      - name: Test authenticated client transport
        run: node --test tests/unit/geometry/qgis-native-client.test.mjs
          tests/unit/geometry/qgis-native-export.test.mjs  tests/unit/geometry/qgis-native-mcp.test.mjs
        env:
          NODE_OPTIONS: --import=./tools/register-consumer.mjs
      - name: Package the source-bound bridge
        shell: pwsh
        run: >
          node tools/qgis/package-native-plugin.mjs --binary
          build-native/qgis/native/Release/pando_qgis_bridge.dll --directory
          build-native/qgis/artifact

          if ($LASTEXITCODE -ne 0) { throw 'QGIS bridge packaging failed' }
        env:
          NODE_OPTIONS: --import=./tools/register-consumer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: native-qgis-bridge-windows-x64-${{ github.sha }}
          path: build-native/qgis/artifact/
          if-no-files-found: error
          retention-days: 7
    env:
      PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
