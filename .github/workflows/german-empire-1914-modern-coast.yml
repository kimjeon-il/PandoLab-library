name: Build German Empire 1914 modern-coast candidate
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |-
            .github
            tools
            tests
            scripts
            config
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 19fd518ca115786d0179347f677cb94596110ed4
          path: .dependencies/pando
          persist-credentials: false
      - name: Select data independently of tool code
        shell: bash
        env:
          NODE_OPTIONS: ""
          PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
          LIBRARY_DATA_REVISION: 921d86aa3c03ffa0b3d5879ad30c9914c4d1b31a
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const file = join(process.env.PANDO_CONSUMER_ROOT, 'config/library-data.json');
          const config = JSON.parse(readFileSync(file, 'utf8'));
          config.revision = process.env.LIBRARY_DATA_REVISION;
          writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE
      - name: Check storage for the existing GIS toolchain
        shell: pwsh
        run: >
          $drive =
          [IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE))

          if ($drive.AvailableFreeSpace -lt 9GB) { throw 'Need estimated 4 GiB
          GIS SDK/build space plus 5 GiB headroom' }
      - name: Prepare only the recipe source inputs
        run: node "$PANDO_CONSUMER_ROOT/tools/data/library-data.mjs"
          --root="$PANDO_CONSUMER_ROOT" --purpose=gis
          --include-prefix=tools/historical-library/sources/german-empire-1914
          --include-prefix=assets/data/countries-ne-5.1.1.geojson
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/cpp/territorial-recipe/territorial-recipe-environment.yml
          init-shell: bash
          cache-environment: true
          cache-downloads: true
      - name: Build selected native generator and candidate
        run: |
          cmake -S tools/cpp/territorial-recipe -DPANDO_CONSUMER_ROOT="$PANDO_CONSUMER_ROOT" -B build-native/territorial-recipe -G Ninja -DPANDO_BUILD_COUNTRY_VALIDATOR=OFF -DPANDO_BUILD_TERRITORIAL_RECIPE=ON
          cmake --build build-native/territorial-recipe --target pando-territorial-recipe
          export PANDO_TERRITORIAL_RECIPE_BINARY="$PWD/build-native/territorial-recipe/pando-territorial-recipe"
          node tools/gis/borders/germany/build-german-1914-base.mjs --modern-coast --output build-native/territorial-recipe/german-1914-modern-coast-candidate.geojson --diagnostics build-native/territorial-recipe/german-1914-modern-coast-diagnostics.json
        env:
          NODE_OPTIONS: --import=./tools/register-consumer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: german-1914-modern-coast-candidate-${{ github.sha }}
          path: |
            .dependencies/pando/build-native/territorial-recipe/german-1914-modern-coast-candidate.geojson
            .dependencies/pando/build-native/territorial-recipe/german-1914-modern-coast-diagnostics.json
          if-no-files-found: error
          retention-days: 7
    env:
      PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
