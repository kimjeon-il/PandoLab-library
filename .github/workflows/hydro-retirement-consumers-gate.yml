name: Hydro v0.13.2 Legacy Consumer Migration
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  migrated-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /.github/
            /tools/
            /tests/
            /scripts/
            /config/
            /package.json
            /pnpm-lock.yaml
            /AGENTS.md
            /README.md
            /archive/index.json
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/Pando
          ref: 19fd518ca115786d0179347f677cb94596110ed4
          path: .dependencies/pando
          persist-credentials: false
      - name: Select data independently of tool code
        shell: bash
        env:
          NODE_OPTIONS: ""
          PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
          LIBRARY_DATA_REVISION: 921d86aa3c03ffa0b3d5879ad30c9914c4d1b31a
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const file = join(process.env.PANDO_CONSUMER_ROOT, 'config/library-data.json');
          const config = JSON.parse(readFileSync(file, 'utf8'));
          config.revision = process.env.LIBRARY_DATA_REVISION;
          writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version-file: .dependencies/pando/.nvmrc
      - name: Prepare only paired Hydro inputs
        run: node tools/data/library-data.mjs --purpose=gis
          --include-prefix=assets/data/hydro
          --include-prefix=assets/data/natural-earth
      - uses: actions/checkout@v4
        with:
          repository: kimjeon-il/PandoLab-library
          ref: 81c45d11d1265e287dd21aaf0127c1112aca1176
          path: .dependencies/pando/original-name-research
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /assets/data/hydro/v0.13.0/metadata-core.json.gz
      - name: Validate migrated consumer source and archived original names
        run: >
          node --check tools/gis/decode-hydro-connectivity.mjs

          node --check "$PANDO_LIBRARY_ROOT/tools/gis/hydro/research-hydro-names.mjs"

          node --check "$PANDO_LIBRARY_ROOT/tools/gis/hydro/promote-hydro-names.mjs"

          node "$PANDO_LIBRARY_ROOT/tools/gis/hydro/research-hydro-names.mjs" --check

          node "$PANDO_LIBRARY_ROOT/tools/gis/hydro/research-hydro-names.mjs" --check
          --archive-core
          original-name-research/assets/data/hydro/v0.13.0/metadata-core.json.gz
      - name: Decode actual 2-file corpus and exercise production Serbia, Croatia and
          Moldova partitions
        run: node tools/gis/decode-hydro-connectivity.mjs assets/data/hydro/v0.13.2
          "$RUNNER_TEMP/hydro-v0132-decoded.json"
    env:
      PANDO_CONSUMER_ROOT: ${{ github.workspace }}/.dependencies/pando
      PANDO_LIBRARY_ROOT: ${{ github.workspace }}
      PANDOLAB_LIBRARY_DATA_ROOT: ${{ github.workspace }}
      NODE_OPTIONS: --import=${{ github.workspace }}/tools/register-consumer.mjs
    defaults:
      run:
        working-directory: .dependencies/pando
