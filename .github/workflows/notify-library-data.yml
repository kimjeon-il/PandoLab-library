name: Notify Pando library data receiver
on:
  push:
    branches: ['main', 'work/gis']
    paths:
      - 'library.json'
      - 'objects/**'
      - 'archive/index.json'
permissions:
  contents: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Notify fixed same-branch app receiver only
        env:
          PANDO_AUTO_DATA_NOTIFY_TOKEN: ${{ secrets.PANDO_AUTO_DATA_NOTIFY_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.PANDO_AUTO_DATA_NOTIFY_TOKEN;
          if (!token) throw new Error('PANDO_AUTO_DATA_NOTIFY_TOKEN is required');
          const branch = process.env.GITHUB_REF_NAME, sha = process.env.GITHUB_SHA;
          if (!['main', 'work/gis'].includes(branch) || !/^(?!0{40}$)[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid notification identity');
          if (process.env.GITHUB_REPOSITORY !== 'kimjeon-il/PandoLab-library-data') throw new Error('Invalid repository');
          const response = await fetch('https://api.github.com/repos/kimjeon-il/Pando/actions/workflows/library-data-auto-sync.yml/dispatches', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(30000),
            headers: {Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
            body: JSON.stringify({ref: branch, inputs: {data_revision: sha, data_branch: branch}})
          });
          if (response.status !== 204) throw new Error(`Fixed receiver notification failed (${response.status})`);
          NODE
